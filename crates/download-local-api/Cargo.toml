[package]
name = "download-local-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
download-core = { path = "../download-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
